<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" font-family="Arial, system-ui, sans-serif" aria-labelledby="evidence-title evidence-desc" id="evidence-root">
<title id="evidence-title">Claims, evidence and review scope</title><desc id="evidence-desc">Claims link arguments to review-owned candidate passages and factual verdicts while retaining source provenance. Passage IDs prove scope, not support. Value judgments get no factual verdict.</desc>
<defs><style>
#evidence-root text { fill:#2d2824; font-family:Arial,system-ui,sans-serif; }
#evidence-root .name { font-size:22px; font-weight:600; }
#evidence-root .sub { font-size:17px; fill:#62574f; }
#evidence-root .tag, #evidence-root .label { font-size:14px; letter-spacing:.05em; fill:#62574f; }
</style><marker id="evidence-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#62574f"/></marker></defs>
<rect width="1280" height="720" fill="#f7f3ed"/><text font-size="16" x="48" y="72" class="name">Claims, evidence and review scope</text><path d="M 328 168 H 464" fill="none" stroke="#62574f" stroke-width="1.5" marker-end="url(#evidence-arrow)"/><rect x="372.0" y="134" width="48" height="24" fill="#f7f3ed"/><text font-size="16" x="396" y="150" class="label" text-anchor="middle">OWNS</text><path d="M 728 168 H 864" fill="none" stroke="#62574f" stroke-width="1.5" marker-end="url(#evidence-arrow)"/><rect x="756.0" y="134" width="80" height="24" fill="#f7f3ed"/><text font-size="16" x="796" y="150" class="label" text-anchor="middle">CONTAINS</text><path d="M 196 224 V 352" fill="none" stroke="#62574f" stroke-width="1.5" marker-end="url(#evidence-arrow)"/><rect x="206.0" y="280" width="80" height="24" fill="#f7f3ed"/><text font-size="16" x="246" y="296" class="label" text-anchor="middle">PROPOSAL</text><path d="M 996 224 V 352" fill="none" stroke="#62574f" stroke-width="1.5" marker-end="url(#evidence-arrow)"/><rect x="1012.0" y="280" width="96" height="24" fill="#f7f3ed"/><text font-size="16" x="1060" y="296" class="label" text-anchor="middle">CANDIDATES</text><path d="M 728 408 H 864" fill="none" stroke="#62574f" stroke-width="1.5" marker-end="url(#evidence-arrow)"/><rect x="760.0" y="374" width="72" height="24" fill="#f7f3ed"/><text font-size="16" x="796" y="390" class="label" text-anchor="middle">FACTUAL</text><path d="M 328 408 H 464" fill="none" stroke="#62574f" stroke-width="1.5" marker-end="url(#evidence-arrow)"/><rect x="364.0" y="374" width="64" height="24" fill="#f7f3ed"/><text font-size="16" x="396" y="390" class="label" text-anchor="middle">CLAIMS</text><g><rect x="64" y="112" width="264" height="112" rx="8" fill="#f3e0d5" stroke="#914024"/><text font-size="16" x="84" y="136" class="tag" fill="#914024">CODE</text><text font-size="16" x="84" y="164" class="name">Review scope</text><text font-size="16" x="84" y="188" class="sub">Proposal + source set</text></g><g><rect x="464" y="112" width="264" height="112" rx="8" fill="#fffdf9" stroke="#62574f"/><text font-size="16" x="484" y="136" class="tag" fill="#62574f">INPUT</text><text font-size="16" x="484" y="164" class="name">Authorized sources</text><text font-size="16" x="484" y="188" class="sub">Review-owned material</text></g><g><rect x="864" y="112" width="264" height="112" rx="8" fill="#fffdf9" stroke="#62574f"/><text font-size="16" x="884" y="136" class="tag" fill="#62574f">EVIDENCE</text><text font-size="16" x="884" y="164" class="name">Source passages</text><text font-size="16" x="884" y="188" class="sub">ID + source + locator</text></g><g><rect x="64" y="352" width="264" height="112" rx="8" fill="#fffdf9" stroke="#62574f"/><text font-size="16" x="84" y="376" class="tag" fill="#62574f">INPUT / MODEL</text><text font-size="16" x="84" y="404" class="name">Proposal + arguments</text><text font-size="16" x="84" y="428" class="sub">Generated text is not evidence</text></g><g><rect x="464" y="352" width="264" height="112" rx="8" fill="#fffdf9" stroke="#62574f"/><text font-size="16" x="484" y="376" class="tag" fill="#62574f">CODE</text><text font-size="16" x="484" y="404" class="name">Atomic claim ledger</text><text font-size="16" x="484" y="428" class="sub">Factual or value judgment</text></g><g><rect x="864" y="352" width="264" height="112" rx="8" fill="#f3e0d5" stroke="#914024"/><text font-size="16" x="884" y="376" class="tag" fill="#914024">MODEL / CODE</text><text font-size="16" x="884" y="404" class="name">Evidence verdict</text><text font-size="16" x="884" y="428" class="sub">Cited or insufficient</text></g>
<line x1="48" y1="640" x2="1232" y2="640" stroke="#d0bfb2"/>
<text font-size="16" x="48" y="669" class="sub">Passage IDs prove scope, not support. Value judgments get no factual verdict.</text>
</svg>