<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" font-family="Arial, system-ui, sans-serif" aria-labelledby="overview-title overview-desc" id="overview-root">
<title id="overview-title">How the review system works</title><desc id="overview-desc">The reviewer consents, supplies a proposal and permitted sources, edits a summary, starts a bounded Groq-backed review, inspects validated local results, and owns the final decision. No sources: Evidence and Synthesis finish locally. Provider error: last saved stage stays available for retry. The model never selects the decision.</desc>
<defs><style>
#overview-root text { fill:#2d2824; font-family:Arial,system-ui,sans-serif; }
#overview-root .name { font-size:22px; font-weight:600; }
#overview-root .sub { font-size:17px; fill:#62574f; }
#overview-root .tag, #overview-root .label { font-size:14px; letter-spacing:.05em; fill:#62574f; }
</style><marker id="overview-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#62574f"/></marker></defs>
<rect width="1280" height="720" fill="#f7f3ed"/><text font-size="16" x="48" y="72" class="name">How the review system works</text><path d="M 296 168 H 352" fill="none" stroke="#62574f" stroke-width="1.5" marker-end="url(#overview-arrow)"/><path d="M 600 168 H 656" fill="none" stroke="#62574f" stroke-width="1.5" marker-end="url(#overview-arrow)"/><path d="M 904 168 H 960" fill="none" stroke="#62574f" stroke-width="1.5" marker-end="url(#overview-arrow)"/><path d="M 1084 224 V 360" fill="none" stroke="#62574f" stroke-width="1.5" marker-end="url(#overview-arrow)"/><path d="M 960 416 H 904" fill="none" stroke="#62574f" stroke-width="1.5" marker-end="url(#overview-arrow)"/><path d="M 656 416 H 600" fill="none" stroke="#62574f" stroke-width="1.5" marker-end="url(#overview-arrow)"/><path d="M 352 416 H 296" fill="none" stroke="#62574f" stroke-width="1.5" marker-end="url(#overview-arrow)"/><g><rect x="48" y="112" width="248" height="112" rx="8" fill="#f3e0d5" stroke="#914024"/><text font-size="16" x="68" y="136" class="tag" fill="#914024">BROWSER</text><text font-size="16" x="68" y="164" class="name">Chat + consent</text><text font-size="16" x="68" y="188" class="sub">Discuss proposal</text><text font-size="16" x="68" y="208" class="sub">Authorize external AI</text></g><g><rect x="352" y="112" width="248" height="112" rx="8" fill="#fffdf9" stroke="#62574f"/><text font-size="16" x="372" y="136" class="tag" fill="#62574f">LOCAL CODE</text><text font-size="16" x="372" y="164" class="name">Source intake</text><text font-size="16" x="372" y="188" class="sub">Text / TXT / MD</text><text font-size="16" x="372" y="208" class="sub">Digital PDF / DOCX</text></g><g><rect x="656" y="112" width="248" height="112" rx="8" fill="#fffdf9" stroke="#62574f"/><text font-size="16" x="676" y="136" class="tag" fill="#62574f">BROWSER</text><text font-size="16" x="676" y="164" class="name">Edit summary</text><text font-size="16" x="676" y="188" class="sub">Options and unknowns</text><text font-size="16" x="676" y="208" class="sub">Reviewer can revise</text></g><g><rect x="960" y="112" width="248" height="112" rx="8" fill="#fffdf9" stroke="#62574f"/><text font-size="16" x="980" y="136" class="tag" fill="#62574f">BROWSER</text><text font-size="16" x="980" y="164" class="name">Generate review</text><text font-size="16" x="980" y="188" class="sub">Explicit reviewer action</text></g><g><rect x="960" y="360" width="248" height="112" rx="8" fill="#fffdf9" stroke="#62574f"/><text font-size="16" x="980" y="384" class="tag" fill="#62574f">SERVER / AI</text><text font-size="16" x="980" y="412" class="name">Stages + Groq</text><text font-size="16" x="980" y="436" class="sub">Claims, pro / con</text><text font-size="16" x="980" y="456" class="sub">Evidence, synthesis</text></g><g><rect x="656" y="360" width="248" height="112" rx="8" fill="#f3e0d5" stroke="#914024"/><text font-size="16" x="676" y="384" class="tag" fill="#914024">LOCAL CODE</text><text font-size="16" x="676" y="412" class="name">Validate + save</text><text font-size="16" x="676" y="436" class="sub">Scope and citations</text><text font-size="16" x="676" y="456" class="sub">Atomic local JSON</text></g><g><rect x="352" y="360" width="248" height="112" rx="8" fill="#fffdf9" stroke="#62574f"/><text font-size="16" x="372" y="384" class="tag" fill="#62574f">BROWSER</text><text font-size="16" x="372" y="412" class="name">Inspect review</text><text font-size="16" x="372" y="436" class="sub">Arguments, passages</text><text font-size="16" x="372" y="456" class="sub">Verdicts, questions</text></g><g><rect x="48" y="360" width="248" height="112" rx="8" fill="#fffdf9" stroke="#62574f"/><text font-size="16" x="68" y="384" class="tag" fill="#62574f">HUMAN</text><text font-size="16" x="68" y="412" class="name">Decide + manage</text><text font-size="16" x="68" y="436" class="sub">Human decision</text><text font-size="16" x="68" y="456" class="sub">History and deletion</text></g>
