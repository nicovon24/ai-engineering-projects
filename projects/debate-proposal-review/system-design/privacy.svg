="484" y="218" class="sub">Checks consent and scope</text><text font-size="16" x="484" y="238" class="sub">Validates model output</text></g><g><rect x="864" y="142" width="264" height="112" rx="8" fill="#fffdf9" stroke="#62574f"/><text font-size="16" x="884" y="166" class="tag" fill="#62574f">PROVIDER</text><text font-size="16" x="884" y="194" class="name">Groq</text><text font-size="16" x="884" y="218" class="sub">Proposal + recent chat</text><text font-size="16" x="884" y="238" class="sub">Bounded source excerpts</text></g><g><rect x="64" y="372" width="264" height="112" rx="8" fill="#fffdf9" stroke="#62574f"/><text font-size="16" x="84" y="396" class="tag" fill="#62574f">LOCAL CODE</text><text font-size="16" x="84" y="424" class="name">Digital intake</text><text font-size="16" x="84" y="448" class="sub">Extract text; discard bytes</text></g><g><rect x="464" y="372" width="264" height="112" rx="8" fill="#f3e0d5" stroke="#914024"/><text font-size="16" x="484" y="396" class="tag" fill="#914024">LOCAL DISK</text><text font-size="16" x="484" y="424" class="name">Review JSON</text><text font-size="16" x="484" y="448" class="sub">Sources, stages, decision</text><text font-size="16" x="484" y="468" class="sub">Delete on request</text></g>
