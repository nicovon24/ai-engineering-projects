<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" font-family="Arial, system-ui, sans-serif" aria-labelledby="privacy-title privacy-desc" id="privacy-root">
<title id="privacy-title">Consent gates external processing</title><desc id="privacy-desc">Explicit consent gates text sent from the local review service to Groq. Original uploaded bytes and human decisions stay on the device. Bounded text crosses to Groq after consent. No-source Evidence and Synthesis finish locally.</desc>
