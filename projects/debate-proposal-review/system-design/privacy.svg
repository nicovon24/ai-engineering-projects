#privacy-root text { fill:#2d2824; font-family:Arial,system-ui,sans-serif; }
#privacy-root .name { font-size:22px; font-weight:600; }
#privacy-root .sub { font-size:17px; fill:#62574f; }
#privacy-root .tag, #privacy-root .label { font-size:14px; letter-spacing:.05em; fill:#62574f; }
</style><marker id="privacy-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#62574f"/></marker></defs>
