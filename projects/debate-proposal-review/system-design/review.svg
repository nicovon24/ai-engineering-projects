<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" font-family="Arial, system-ui, sans-serif" aria-labelledby="review-title review-desc" id="review-root">
<title id="review-title">From conversation to human decision</title><desc id="review-desc">A review advances through seven persisted analysis states, then a separate human decision. With no sources, Evidence and Synthesis finish in code. A failed call keeps the last saved stage.</desc>
<defs><style>
#review-root text { fill:#2d2824; font-family:Arial,system-ui,sans-serif; }
#review-root .name { font-size:22px; font-weight:600; }
#review-root .sub { font-size:17px; fill:#62574f; }
#review-root .tag, #review-root .label { font-size:14px; letter-spacing:.05em; fill:#62574f; }
</style><marker id="review-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#62574f"/></marker></defs>
<rect width="1280" height="720" fill="#f7f3ed"/><text font-size="16" x="48" y="72" class="name">From conversation to human decision</text><path d="M 296 168 H 352" fill="none" stroke="#62574f" stroke-width="1.5" marker-end="url(#review-arrow)"/><path d="M 600 168 H 656" fill="none" stroke="#62574f" stroke-width="1.5" marker-end="url(#review-arrow)"/><path d="M 904 168 H 960" fill="none" stroke="#62574f" stroke-width="1.5" marker-end="url(#review-arrow)"/><path d="M 1084 224 V 360" fill="none" stroke="#62574f" stroke-width="1.5" marker-end="url(#review-arrow)"/><path d="M 960 416 H 904" fill="none" stroke="#62574f" stroke-width="1.5" marker-end="url(#review-arrow)"/><path d="M 656 416 H 600" fill="none" stroke="#62574f" stroke-width="1.5" marker-end="url(#review-arrow)"/><path d="M 352 416 H 296" fill="none" stroke="#62574f" stroke-width="1.5" marker-end="url(#review-arrow)"/><g><rect x="48" y="112" width="248" height="112" rx="8" fill="#f3e0d5" stroke="#914024"/><text font-size="16" x="68" y="136" class="tag" fill="#914024">HUMAN</text><text font-size="16" x="68" y="164" class="name">Draft</text><text font-size="16" x="68" y="188" class="sub">Consent + summary</text></g><g><rect x="352" y="112" width="248" height="112" rx="8" fill="#fffdf9" stroke="#62574f"/><text font-size="16" x="372" y="136" class="tag" fill="#62574f">MODEL</text><text font-size="16" x="372" y="164" class="name">Claims</text><text font-size="16" x="372" y="188" class="sub">Proposal statements</text></g><g><rect x="656" y="112" width="248" height="112" rx="8" fill="#fffdf9" stroke="#62574f"/><text font-size="16" x="676" y="136" class="tag" fill="#62574f">MODEL</text><text font-size="16" x="676" y="164" class="name">Supporting</text><text font-size="16" x="676" y="188" class="sub">Reasons in favor</text></g><g><rect x="960" y="112" width="248" height="112" rx="8" fill="#fffdf9" stroke="#62574f"/><text font-size="16" x="980" y="136" class="tag" fill="#62574f">MODEL</text><text font-size="16" x="980" y="164" class="name">Opposing</text><text font-size="16" x="980" y="188" class="sub">Reasons against</text></g><g><rect x="960" y="360" width="248" height="112" rx="8" fill="#fffdf9" stroke="#62574f"/><text font-size="16" x="980" y="384" class="tag" fill="#62574f">CODE / MODEL</text><text font-size="16" x="980" y="412" class="name">Evidence</text><text font-size="16" x="980" y="436" class="sub">Claim verdicts</text></g><g><rect x="656" y="360" width="248" height="112" rx="8" fill="#fffdf9" stroke="#62574f"/><text font-size="16" x="676" y="384" class="tag" fill="#62574f">CODE / MODEL</text><text font-size="16" x="676" y="412" class="name">Synthesis</text><text font-size="16" x="676" y="436" class="sub">Limits + questions</text></g><g><rect x="352" y="360" width="248" height="112" rx="8" fill="#f3e0d5" stroke="#914024"/><text font-size="16" x="372" y="384" class="tag" fill="#914024">CODE</text><text font-size="16" x="372" y="412" class="name">Complete</text><text font-size="16" x="372" y="436" class="sub">Analysis ready</text></g><g><rect x="48" y="360" width="248" height="112" rx="8" fill="#fffdf9" stroke="#62574f"/><text font-size="16" x="68" y="384" class="tag" fill="#62574f">HUMAN</text><text font-size="16" x="68" y="412" class="name">Human decision</text><text font-size="16" x="68" y="436" class="sub">Approve / reject / defer</text></g>
<line x1="48" y1="640" x2="1232" y2="640" stroke="#d0bfb2"/>
<text font-size="16" x="48" y="669" class="sub">With no sources, Evidence and Synthesis finish in code. A failed call keeps the last saved stage.</text>
