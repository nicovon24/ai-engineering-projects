<?xml version="1.0" encoding="UTF-8"?>
<svg width="1920" height="1080" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Arial, sans-serif" aria-labelledby="ai-title ai-desc" id="ai-root">
    <title id="ai-title">AI + RAG architecture</title>
    <desc id="ai-desc">The current app retrieves local passages for optional Groq answers; tools and MCP are shown separately as an unimplemented concept.</desc>
    <defs>
      <style>#ai-root { color: #2d3142; font-family: Geist, system-ui, sans-serif; }
      #ai-root .diagram-container { width: 100%; overflow-x: auto; }
      #ai-root .node { fill: #2d3142; font: 600 18px Geist, system-ui, sans-serif; }
      #ai-root .diagram-title { fill: #2d3142; font: 400 40px 'Instrument Serif', Georgia, serif; }
      #ai-root .sub { fill: #5a6580; font: 400 13px 'Geist Mono', monospace; }
      #ai-root .tag, #ai-root .eyebrow, #ai-root .row-label { fill: #4f5d75; font: 500 11px 'Geist Mono', monospace; letter-spacing: .10em; }
      #ai-root .stage { fill: #2d3142; font: 600 18px Geist, system-ui, sans-serif; }
      #ai-root .arrow-label { fill: #4f5d75; font: 400 11px 'Geist Mono', monospace; letter-spacing: .06em; }
      #ai-root .note { fill: #4f5d75; font: 400 15px Geist, system-ui, sans-serif; }
      #ai-root .diagram-footer { fill: #4f5d75; font: 400 12px 'Geist Mono', monospace; }
      @media print {
#ai-root .diagram-container { overflow-x: visible; }
}</style>
      <marker id="ai-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#4f5d75"/></marker>
      <marker id="ai-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#bf4520"/></marker>
      <marker id="ai-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#2e5aa8"/></marker>
    </defs>
    <rect width="1280" height="720" fill="#f5f5f5"/>
    <text x="48" y="48" class="eyebrow" font-size="11" text-anchor="start">DOCUMENT INTELLIGENCE  /  CURRENT LOCAL PROTOTYPE</text>
<text x="48" y="98" class="diagram-title" font-size="40" text-anchor="start">AI + RAG architecture</text>
<text x="48" y="128" class="note" font-size="15" text-anchor="start">What runs today, and where tools and MCP would fit</text>
<rect x="48" y="176" width="1184" height="360" rx="8" fill="#f5f5f5" stroke="#bfc0c0" />
<rect x="72" y="168" width="128" height="18" rx="2" fill="#f5f5f5" stroke="none" />
<text x="80" y="182" class="eyebrow" font-size="11" text-anchor="start">CURRENT APP</text>
<path d="M 252 268 H 300" fill="none" stroke="#4f5d75" stroke-width="2.2" marker-end="url(#ai-arrow)" />
<path d="M 500 268 H 548" fill="none" stroke="#bf4520" stroke-width="2.2" marker-end="url(#ai-arrow-accent)" />
<path d="M 748 268 H 796" fill="none" stroke="#bf4520" stroke-width="2.2" marker-end="url(#ai-arrow-accent)" />
<path d="M 996 268 H 1044" fill="none" stroke="#4f5d75" stroke-width="2.2" marker-end="url(#ai-arrow)" />
<path d="M 420 316 V 336 Q 420 344 428 344 H 592 Q 600 344 600 352 V 372" fill="none" stroke="#4f5d75" stroke-width="2.2" marker-end="url(#ai-arrow)" />
<path d="M 700 372 V 316" fill="none" stroke="#bf4520" stroke-width="2.2" marker-end="url(#ai-arrow-accent)" />
<path d="M 720 316 V 336 Q 720 344 728 344 H 1128 Q 1136 344 1136 336 V 316" fill="none" stroke="#4f5d75" stroke-width="2.2" marker-end="url(#ai-arrow)" stroke-dasharray="5,4"/>
<text x="900" y="336" class="arrow-label" font-size="11" text-anchor="middle">NO-KEY PATH</text>
<rect x="72" y="220" width="180" height="96" rx="6" fill="#f5f5f5" stroke="none" />
<rect x="72" y="220" width="180" height="96" rx="6" fill="#ffffff" stroke="#bfc0c0" />
<rect x="84" y="228" width="68" height="18" rx="2" fill="#f5f5f5" stroke="#bfc0c0" />
<text x="118" y="241" class="tag" font-size="11" text-anchor="middle">INPUT</text>
<text x="88" y="274" class="node" font-size="18" text-anchor="start">Web UI</text>
<text x="88" y="298" class="sub" font-size="13" text-anchor="start">upload; ask ES/EN</text>
<rect x="300" y="220" width="200" height="96" rx="6" fill="#f5f5f5" stroke="none" />
<rect x="300" y="220" width="200" height="96" rx="6" fill="#ffffff" stroke="#bfc0c0" />
<rect x="312" y="228" width="68" height="18" rx="2" fill="#f5f5f5" stroke="#bfc0c0" />
<text x="346" y="241" class="tag" font-size="11" text-anchor="middle">CONTROL</text>
<text x="316" y="274" class="node" font-size="18" text-anchor="start">App server</text>
<text x="316" y="298" class="sub" font-size="13" text-anchor="start">parse; quota; validate</text>
<rect x="548" y="220" width="200" height="96" rx="6" fill="#f5f5f5" stroke="none" />
<rect x="548" y="220" width="200" height="96" rx="6" fill="#f1e7e4" stroke="#bf4520" />
<rect x="560" y="228" width="68" height="18" rx="2" fill="#f5f5f5" stroke="#bf4520" />
<text x="594" y="241" class="tag" font-size="11" text-anchor="middle">RAG</text>
<text x="564" y="274" class="node" font-size="18" text-anchor="start">Hybrid search</text>
<text x="564" y="298" class="sub" font-size="13" text-anchor="start">lexical + semantic</text>
<rect x="796" y="220" width="200" height="96" rx="6" fill="#f5f5f5" stroke="none" />
<rect x="796" y="220" width="200" height="96" rx="6" fill="#ffffff" stroke="#bfc0c0" />
<rect x="808" y="228" width="68" height="18" rx="2" fill="#f5f5f5" stroke="#bfc0c0" />
<text x="842" y="241" class="tag" font-size="11" text-anchor="middle">MODEL</text>
<text x="812" y="274" class="node" font-size="18" text-anchor="start">Groq LLM</text>
<text x="812" y="298" class="sub" font-size="13" text-anchor="start">context to JSON claims</text>
<rect x="1044" y="220" width="180" height="96" rx="6" fill="#f5f5f5" stroke="none" />
<rect x="1044" y="220" width="180" height="96" rx="6" fill="#ffffff" stroke="#bfc0c0" />
<rect x="1056" y="228" width="68" height="18" rx="2" fill="#f5f5f5" stroke="#bfc0c0" />
<text x="1090" y="241" class="tag" font-size="11" text-anchor="middle">OUTPUT</text>
<text x="1060" y="274" class="node" font-size="18" text-anchor="start">Result in UI</text>
<text x="1060" y="298" class="sub" font-size="13" text-anchor="start">server-checked IDs</text>
<rect x="548" y="372" width="200" height="96" rx="6" fill="#f5f5f5" stroke="none" />
<rect x="548" y="372" width="200" height="96" rx="6" fill="#ffffff" stroke="#bfc0c0" />
<rect x="560" y="380" width="68" height="18" rx="2" fill="#f5f5f5" stroke="#bfc0c0" />
<text x="594" y="393" class="tag" font-size="11" text-anchor="middle">DATA</text>
<text x="564" y="426" class="node" font-size="18" text-anchor="start">Local workspace</text>
<text x="564" y="450" class="sub" font-size="13" text-anchor="start">files; passages; vectors</text>
<text x="80" y="494" class="note" font-size="15" text-anchor="start">RAG selects file passages; Groq sees up to five. Rewrite sees only question + locale.</text>
<text x="80" y="518" class="note" font-size="15" text-anchor="start">Groq returns to the server for citation-ID checks. No key: evidence only. No support: abstain.</text>
<rect x="48" y="560" width="1184" height="112" rx="8" fill="#f5f5f5" stroke="#bfc0c0" stroke-dasharray="5,4"/>
<rect x="72" y="552" width="232" height="18" rx="2" fill="#f5f5f5" stroke="none" />
<text x="80" y="566" class="eyebrow" font-size="11" text-anchor="start">CONCEPTUAL  /  NOT WIRED</text>
<path d="M 560 608 H 720" fill="none" stroke="#4f5d75" stroke-width="2.2" marker-end="url(#ai-arrow)" stroke-dasharray="5,4"/>
<path d="M 720 632 H 560" fill="none" stroke="#4f5d75" stroke-width="2.2" marker-end="url(#ai-arrow)" stroke-dasharray="5,4"/>
<text x="640" y="598" class="arrow-label" font-size="11" text-anchor="middle">MCP TOOL CALL</text>
<text x="640" y="654" class="arrow-label" font-size="11" text-anchor="middle">TOOL RESULT</text>
<rect x="80" y="584" width="480" height="64" rx="6" fill="#ffffff" stroke="#bfc0c0" />
<text x="96" y="612" class="node" font-size="18" text-anchor="start">AI app / MCP client</text>
<text x="96" y="636" class="sub" font-size="13" text-anchor="start">model chooses; app calls the tool</text>
<rect x="720" y="584" width="480" height="64" rx="6" fill="#ffffff" stroke="#bfc0c0" />
<text x="736" y="612" class="node" font-size="18" text-anchor="start">MCP server + tools</text>
<text x="736" y="636" class="sub" font-size="13" text-anchor="start">exposes operations and resources</text>
<text x="48" y="700" class="diagram-footer" font-size="12" text-anchor="start">Today, server code orchestrates retrieval. The model does not invoke tools; there is no MCP connection.</text>
  </svg>
