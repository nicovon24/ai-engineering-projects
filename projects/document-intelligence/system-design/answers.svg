<rect x="48" y="204" width="200" height="96" rx="6" fill="#ffffff" stroke="#bfc0c0" />
<rect x="60" y="212" width="68" height="18" rx="2" fill="#f5f5f5" stroke="#bfc0c0" />
<text x="94" y="225" class="tag" font-size="11" text-anchor="middle">INPUT</text>
<text x="64" y="258" class="node" font-size="18" text-anchor="start">Question</text>
<text x="64" y="282" class="sub" font-size="13" text-anchor="start">retrieve up to 5 passages</text>
<path d="M 382 198 L 466 252 L 382 306 L 298 252 Z" fill="#ffffff" stroke="#bfc0c0" stroke-width="2"/>
<text x="382" y="248" class="node" font-size="18" text-anchor="middle">Passages?</text>
<text x="382" y="270" class="sub" font-size="13" text-anchor="middle">selected locally</text>
<path d="M 642 198 L 726 252 L 642 306 L 558 252 Z" fill="#ffffff" stroke="#bfc0c0" stroke-width="2"/>
<text x="642" y="248" class="node" font-size="18" text-anchor="middle">Groq key?</text>
<text x="642" y="270" class="sub" font-size="13" text-anchor="middle">configured</text>
<path d="M 902 198 L 986 252 L 902 306 L 818 252 Z" fill="#ffffff" stroke="#bfc0c0" stroke-width="2"/>
<text x="902" y="248" class="node" font-size="18" text-anchor="middle">Answered?</text>
<text x="902" y="270" class="sub" font-size="13" text-anchor="middle">model status</text>
<rect x="1050" y="204" width="182" height="96" rx="6" fill="#f5f5f5" stroke="none" />
<rect x="1050" y="204" width="182" height="96" rx="6" fill="#f1e7e4" stroke="#bf4520" />
