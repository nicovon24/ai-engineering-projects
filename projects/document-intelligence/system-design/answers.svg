<text x="1066" y="258" class="node" font-size="18" text-anchor="start">Cited claims</text>
<text x="1066" y="282" class="sub" font-size="13" text-anchor="start">validated IDs</text>
<rect x="266" y="424" width="232" height="96" rx="6" fill="#f5f5f5" stroke="none" />
<rect x="266" y="424" width="232" height="96" rx="6" fill="#ffffff" stroke="#bfc0c0" />
<rect x="278" y="432" width="68" height="18" rx="2" fill="#f5f5f5" stroke="#bfc0c0" />
<text x="312" y="445" class="tag" font-size="11" text-anchor="middle">LIMIT</text>
<text x="282" y="478" class="node" font-size="18" text-anchor="start">Insufficient evidence</text>
<text x="282" y="502" class="sub" font-size="13" text-anchor="start">no passages selected</text>
<rect x="526" y="424" width="232" height="96" rx="6" fill="#f5f5f5" stroke="none" />
<rect x="526" y="424" width="232" height="96" rx="6" fill="#ffffff" stroke="#bfc0c0" />
<rect x="538" y="432" width="68" height="18" rx="2" fill="#f5f5f5" stroke="#bfc0c0" />
<text x="572" y="445" class="tag" font-size="11" text-anchor="middle">LOCAL</text>
<text x="542" y="478" class="node" font-size="18" text-anchor="start">Evidence only</text>
<text x="542" y="502" class="sub" font-size="13" text-anchor="start">passages; no AI answer</text>
<rect x="786" y="424" width="232" height="96" rx="6" fill="#f5f5f5" stroke="none" />
<rect x="786" y="424" width="232" height="96" rx="6" fill="#ffffff" stroke="#bfc0c0" />
<rect x="798" y="432" width="68" height="18" rx="2" fill="#f5f5f5" stroke="#bfc0c0" />
<text x="832" y="445" class="tag" font-size="11" text-anchor="middle">LIMIT</text>
<text x="802" y="478" class="node" font-size="18" text-anchor="start">Insufficient evidence</text>
<text x="802" y="502" class="sub" font-size="13" text-anchor="start">model abstains</text>
<rect x="48" y="556" width="1184" height="92" rx="6" fill="#f1e7e4" stroke="#bfc0c0" />
<text x="68" y="584" class="eyebrow" font-size="11" text-anchor="start">SEPARATE GENERAL TEXT</text>
<text x="68" y="610" class="note" font-size="15" text-anchor="start">With a key and insufficient evidence: a narrow concept explanation or fixed verification limit may appear.</text>
<text x="68" y="632" class="diagram-footer" font-size="12" text-anchor="start">It has no document citations. If this optional step fails, the documentary limit remains.</text>
<line x1="48" y1="668" x2="1232" y2="668" stroke="#bfc0c0"/>
<text x="48" y="696" class="diagram-footer" font-size="12" text-anchor="start">A valid passage ID proves existence, not semantic support; provider or validation errors show an error instead.</text>
  </svg>
