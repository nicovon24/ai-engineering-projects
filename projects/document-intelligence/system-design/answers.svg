<?xml version="1.0" encoding="UTF-8"?>
<svg width="1920" height="1080" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Arial, sans-serif" aria-labelledby="answers-title answers-desc" id="answers-root">
    <title id="answers-title">Document answer modes</title>
    <desc id="answers-desc">The question route distinguishes cited documentary claims, local evidence-only passages, and insufficient evidence. With Groq configured, an abstention may also show separately labeled general text or a fixed verification limit without document citations.</desc>
    <defs>
      <style>#answers-root { color: #2d3142; font-family: Geist, system-ui, sans-serif; }
      #answers-root .diagram-container { width: 100%; overflow-x: auto; }
      #answers-root .node { fill: #2d3142; font: 600 18px Geist, system-ui, sans-serif; }
      #answers-root .diagram-title { fill: #2d3142; font: 400 40px 'Instrument Serif', Georgia, serif; }
      #answers-root .sub { fill: #5a6580; font: 400 13px 'Geist Mono', monospace; }
      #answers-root .tag, #answers-root .eyebrow, #answers-root .row-label { fill: #4f5d75; font: 500 11px 'Geist Mono', monospace; letter-spacing: .10em; }
      #answers-root .stage { fill: #2d3142; font: 600 18px Geist, system-ui, sans-serif; }
      #answers-root .arrow-label { fill: #4f5d75; font: 400 11px 'Geist Mono', monospace; letter-spacing: .06em; }
      #answers-root .note { fill: #4f5d75; font: 400 15px Geist, system-ui, sans-serif; }
      #answers-root .diagram-footer { fill: #4f5d75; font: 400 12px 'Geist Mono', monospace; }
      @media print {
#answers-root .diagram-container { overflow-x: visible; }
}</style>
      <marker id="answers-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#4f5d75"/></marker>
      <marker id="answers-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#bf4520"/></marker>
      <marker id="answers-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#2e5aa8"/></marker>
    </defs>
    <rect width="1280" height="720" fill="#f5f5f5"/>
    <text x="48" y="48" class="eyebrow" font-size="11" text-anchor="start">DOCUMENT INTELLIGENCE  /  CURRENT LOCAL PROTOTYPE</text>
<text x="48" y="98" class="diagram-title" font-size="40" text-anchor="start">What the answer can show</text>
<text x="48" y="128" class="note" font-size="15" text-anchor="start">The documentary result is decided before any separate general text.</text>
