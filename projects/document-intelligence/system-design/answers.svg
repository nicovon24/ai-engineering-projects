<text x="422.0" y="366" class="arrow-label" font-size="11" text-anchor="middle">NO</text>
<rect x="658" y="354" width="48" height="16" rx="2" fill="#f5f5f5" stroke="none" />
<text x="682.0" y="366" class="arrow-label" font-size="11" text-anchor="middle">NO</text>
<rect x="918" y="354" width="48" height="16" rx="2" fill="#f5f5f5" stroke="none" />
<text x="942.0" y="366" class="arrow-label" font-size="11" text-anchor="middle">NO</text>
