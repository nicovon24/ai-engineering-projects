<?xml version="1.0" encoding="UTF-8"?>
<svg width="1920" height="1080" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Arial, sans-serif" aria-labelledby="improvements-title improvements-desc" id="improvements-root">
    <title id="improvements-title">Proposed assistant improvements</title>
    <desc id="improvements-desc">Proposed stages resolve conversational questions, route to document, general, or optional web sources, verify claim support, and deliver a source-labeled answer. The sequence is future work, not current behavior.</desc>
    <defs>
      <style>#improvements-root { color: #2d3142; font-family: Geist, system-ui, sans-serif; }
      #improvements-root .diagram-container { width: 100%; overflow-x: auto; }
      #improvements-root .node { fill: #2d3142; font: 600 18px Geist, system-ui, sans-serif; }
      #improvements-root .diagram-title { fill: #2d3142; font: 400 40px 'Instrument Serif', Georgia, serif; }
      #improvements-root .sub { fill: #5a6580; font: 400 13px 'Geist Mono', monospace; }
      #improvements-root .tag, #improvements-root .eyebrow, #improvements-root .row-label { fill: #4f5d75; font: 500 11px 'Geist Mono', monospace; letter-spacing: .10em; }
      #improvements-root .stage { fill: #2d3142; font: 600 18px Geist, system-ui, sans-serif; }
      #improvements-root .arrow-label { fill: #4f5d75; font: 400 11px 'Geist Mono', monospace; letter-spacing: .06em; }
      #improvements-root .note { fill: #4f5d75; font: 400 15px Geist, system-ui, sans-serif; }
      #improvements-root .diagram-footer { fill: #4f5d75; font: 400 12px 'Geist Mono', monospace; }
      @media print {
#improvements-root .diagram-container { overflow-x: visible; }
}</style>
      <marker id="improvements-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#4f5d75"/></marker>
      <marker id="improvements-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#bf4520"/></marker>
      <marker id="improvements-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#2e5aa8"/></marker>
    </defs>
