<?xml version="1.0" encoding="UTF-8"?>
<svg width="1920" height="1080" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Arial, sans-serif" aria-labelledby="overview-title overview-desc" id="overview-root">
    <title id="overview-title">How the system works</title>
    <desc id="overview-desc">Browser actions reach the Next.js server, which extracts and saves sources, retrieves passages, optionally calls Groq, and returns inspectable results from a temporary local workspace.</desc>
    <defs>
      <style>#overview-root { color: #2d3142; font-family: Geist, system-ui, sans-serif; }
      #overview-root .diagram-container { width: 100%; overflow-x: auto; }
      #overview-root .node { fill: #2d3142; font: 600 18px Geist, system-ui, sans-serif; }
      #overview-root .diagram-title { fill: #2d3142; font: 400 40px 'Instrument Serif', Georgia, serif; }
      #overview-root .sub { fill: #5a6580; font: 400 13px 'Geist Mono', monospace; }
      #overview-root .tag, #overview-root .eyebrow, #overview-root .row-label { fill: #4f5d75; font: 500 11px 'Geist Mono', monospace; letter-spacing: .10em; }
      #overview-root .stage { fill: #2d3142; font: 600 18px Geist, system-ui, sans-serif; }
      #overview-root .arrow-label { fill: #4f5d75; font: 400 11px 'Geist Mono', monospace; letter-spacing: .06em; }
      #overview-root .note { fill: #4f5d75; font: 400 15px Geist, system-ui, sans-serif; }
      #overview-root .diagram-footer { fill: #4f5d75; font: 400 12px 'Geist Mono', monospace; }
      @media print {
#overview-root .diagram-container { overflow-x: visible; }
}</style>
      <marker id="overview-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#4f5d75"/></marker>
      <marker id="overview-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#bf4520"/></marker>
      <marker id="overview-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#2e5aa8"/></marker>
    </defs>
    <rect width="1280" height="720" fill="#f5f5f5"/>
    <text x="48" y="48" class="eyebrow" font-size="11" text-anchor="start">DOCUMENT INTELLIGENCE  /  CURRENT LOCAL PROTOTYPE</text>
<text x="48" y="98" class="diagram-title" font-size="40" text-anchor="start">How the system works</text>
<text x="48" y="128" class="note" font-size="15" text-anchor="start">One temporary workspace connects uploaded sources, questions, and inspectable results.</text>
<rect x="48" y="176" width="262" height="374" rx="8" fill="#f5f5f5" stroke="#bfc0c0" />
<rect x="352" y="176" width="574" height="374" rx="8" fill="#f5f5f5" stroke="#bfc0c0" />
<rect x="968" y="176" width="264" height="374" rx="8" fill="#f5f5f5" stroke="#bfc0c0" />
<rect x="64" y="168" width="122" height="18" rx="2" fill="#f5f5f5" stroke="none" />
<rect x="368" y="168" width="162" height="18" rx="2" fill="#f5f5f5" stroke="none" />
<rect x="984" y="168" width="152" height="18" rx="2" fill="#f5f5f5" stroke="none" />
<text x="72" y="182" class="eyebrow" font-size="11" text-anchor="start">VISITOR + UI</text>
<text x="376" y="182" class="eyebrow" font-size="11" text-anchor="start">NEXT.JS SERVER</text>
<text x="992" y="182" class="eyebrow" font-size="11" text-anchor="start">LOCAL WORKSPACE</text>
<path d="M 286 282 H 386" fill="none" stroke="#4f5d75" stroke-width="2.2" marker-end="url(#overview-arrow)" />
<path d="M 600 282 H 686" fill="none" stroke="#bf4520" stroke-width="2.2" marker-end="url(#overview-arrow-accent)" />
<path d="M 900 282 H 990" fill="none" stroke="#bf4520" stroke-width="2.2" marker-end="url(#overview-arrow-accent)" />
<path d="M 286 422 H 386" fill="none" stroke="#4f5d75" stroke-width="2.2" marker-end="url(#overview-arrow)" />
<path d="M 600 422 H 686" fill="none" stroke="#bf4520" stroke-width="2.2" marker-end="url(#overview-arrow-accent)" />
<rect x="68" y="242" width="208" height="80" rx="6" fill="#ffffff" stroke="#bfc0c0" />
<text x="172" y="278" class="node" font-size="18" text-anchor="middle">Upload files</text>
<text x="172" y="300" class="sub" font-size="13" text-anchor="middle">PDF, DOCX, TXT, MD</text>
<rect x="68" y="382" width="208" height="80" rx="6" fill="#ffffff" stroke="#bfc0c0" />
<text x="172" y="418" class="node" font-size="18" text-anchor="middle">Ask in ES / EN</text>
<text x="172" y="440" class="sub" font-size="13" text-anchor="middle">question + locale</text>
<rect x="386" y="242" width="208" height="80" rx="6" fill="#ffffff" stroke="#bfc0c0" />
<text x="490" y="278" class="node" font-size="18" text-anchor="middle">Extract text</text>
<text x="490" y="300" class="sub" font-size="13" text-anchor="middle">validate + chunk</text>
<rect x="686" y="242" width="208" height="80" rx="6" fill="#f1e7e4" stroke="#bf4520" />
<text x="790" y="278" class="node" font-size="18" text-anchor="middle">Save sources</text>
<text x="790" y="300" class="sub" font-size="13" text-anchor="middle">files + passage IDs</text>
<rect x="386" y="382" width="208" height="80" rx="6" fill="#ffffff" stroke="#bfc0c0" />
<text x="490" y="418" class="node" font-size="18" text-anchor="middle">Find passages</text>
<text x="490" y="440" class="sub" font-size="13" text-anchor="middle">words + local vectors</text>
<rect x="686" y="382" width="208" height="80" rx="6" fill="#ffffff" stroke="#bfc0c0" />
<text x="790" y="418" class="node" font-size="18" text-anchor="middle">Build result</text>
<text x="790" y="440" class="sub" font-size="13" text-anchor="middle">Groq + ID checks</text>
<rect x="990" y="242" width="208" height="80" rx="6" fill="#ffffff" stroke="#bfc0c0" />
<text x="1094" y="278" class="node" font-size="18" text-anchor="middle">Files + passages</text>
<text x="1094" y="300" class="sub" font-size="13" text-anchor="middle">optional vector index</text>
<rect x="990" y="382" width="208" height="80" rx="6" fill="#ffffff" stroke="#bfc0c0" />
<text x="1094" y="418" class="node" font-size="18" text-anchor="middle">Question history</text>
<text x="1094" y="440" class="sub" font-size="13" text-anchor="middle">saved questions</text>
<text x="68" y="510" class="note" font-size="15" text-anchor="start">Inspect sources; delete.</text>
<text x="374" y="510" class="note" font-size="15" text-anchor="start">Only the server reads files or calls Groq.</text>
<line x1="48" y1="584" x2="1232" y2="584" stroke="#bfc0c0"/>
<text x="48" y="614" class="eyebrow" font-size="11" text-anchor="start">RESULT IN THE UI</text>
<text x="244" y="614" class="note" font-size="15" text-anchor="start">Cited answer + sources, evidence-only passages (no key), or insufficient evidence.</text>
<text x="48" y="644" class="diagram-footer" font-size="12" text-anchor="start">Groq may add separate uncited general text after abstention; invalid responses show an error.</text>
<line x1="48" y1="668" x2="1232" y2="668" stroke="#bfc0c0"/>
<text x="48" y="696" class="diagram-footer" font-size="12" text-anchor="start">Manual deletion removes local files, passages, vectors, and questions; expiry is enforced on access.</text>
  </svg>
