<path d="M 840 448 H 960" fill="none" stroke="#4f5d75" stroke-width="2.2" marker-end="url(#sources-arrow)" stroke-dasharray="5,4"/>
<rect x="854" y="424" width="88" height="16" rx="2" fill="#f5f5f5" stroke="none" />
