<text x="356" y="234" class="node" font-size="18" text-anchor="start">Parse file</text>
<text x="356" y="258" class="sub" font-size="13" text-anchor="start">validate; extract text</text>
<rect x="600" y="180" width="240" height="96" rx="6" fill="#f5f5f5" stroke="none" />
<rect x="600" y="180" width="240" height="96" rx="6" fill="#f1e7e4" stroke="#bf4520" />
<rect x="612" y="188" width="68" height="18" rx="2" fill="#f5f5f5" stroke="#bf4520" />
<text x="646" y="201" class="tag" font-size="11" text-anchor="middle">SOURCE</text>
<text x="616" y="234" class="node" font-size="18" text-anchor="start">Passages + optional index</text>
<text x="616" y="258" class="sub" font-size="13" text-anchor="start">IDs; offsets; optional vectors</text>
<rect x="80" y="408" width="200" height="96" rx="6" fill="#f5f5f5" stroke="none" />
<rect x="80" y="408" width="200" height="96" rx="6" fill="#ffffff" stroke="#bfc0c0" />
<rect x="92" y="416" width="68" height="18" rx="2" fill="#f5f5f5" stroke="#bfc0c0" />
<text x="126" y="429" class="tag" font-size="11" text-anchor="middle">INPUT</text>
<text x="96" y="462" class="node" font-size="18" text-anchor="start">Ask in ES / EN</text>
<text x="96" y="486" class="sub" font-size="13" text-anchor="start">question + locale</text>
<rect x="340" y="408" width="200" height="96" rx="6" fill="#f5f5f5" stroke="none" />
<rect x="340" y="408" width="200" height="96" rx="6" fill="#ffffff" stroke="#bfc0c0" />
<rect x="352" y="416" width="68" height="18" rx="2" fill="#f5f5f5" stroke="#bfc0c0" />
<text x="386" y="429" class="tag" font-size="11" text-anchor="middle">SEARCH</text>
<text x="356" y="462" class="node" font-size="18" text-anchor="start">Select evidence</text>
<text x="356" y="486" class="sub" font-size="13" text-anchor="start">hybrid / lexical fallback</text>
<rect x="600" y="408" width="240" height="96" rx="6" fill="#f5f5f5" stroke="none" />
<rect x="600" y="408" width="240" height="96" rx="6" fill="#ffffff" stroke="#bfc0c0" />
<rect x="612" y="416" width="68" height="18" rx="2" fill="#f5f5f5" stroke="#bfc0c0" />
<text x="646" y="429" class="tag" font-size="11" text-anchor="middle">RESULT</text>
<text x="616" y="462" class="node" font-size="18" text-anchor="start">Documentary result</text>
<text x="616" y="486" class="sub" font-size="13" text-anchor="start">answer / evidence / abstain</text>
<rect x="960" y="408" width="220" height="96" rx="6" fill="#f5f5f5" stroke="none" />
<rect x="960" y="408" width="220" height="96" rx="6" fill="#ffffff" stroke="#bfc0c0" />
<rect x="972" y="416" width="68" height="18" rx="2" fill="#f5f5f5" stroke="#bfc0c0" />
<text x="1006" y="429" class="tag" font-size="11" text-anchor="middle">UI</text>
<text x="976" y="462" class="node" font-size="18" text-anchor="start">Inspect source</text>
<text x="976" y="486" class="sub" font-size="13" text-anchor="start">passage + original file</text>
<line x1="80" y1="540" x2="1200" y2="540" stroke="#bfc0c0"/>
<text x="80" y="574" class="note" font-size="15" text-anchor="start">Overview questions sample passages; optional Groq rewrite sees only question and locale.</text>
<text x="80" y="602" class="note" font-size="15" text-anchor="start">A passage ID links a claim to an existing source; semantic support still needs evaluation.</text>
<line x1="40" y1="644" x2="1240" y2="644" stroke="#bfc0c0"/>
<text x="40" y="668" class="eyebrow" font-size="11" text-anchor="start">DATA LINEAGE</text>
<text x="252" y="668" class="diagram-footer" font-size="12" text-anchor="start">Dashed paths are used when a source is available for inspection.</text>
  </svg>
