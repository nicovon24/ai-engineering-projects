<?xml version="1.0" encoding="UTF-8"?>
<svg width="1920" height="1080" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Arial, sans-serif" aria-labelledby="sources-title sources-desc" id="sources-root">
    <title id="sources-title">From uploaded file to inspectable source</title>
    <desc id="sources-desc">Files become passages; questions select passages for a documentary result whose source can be inspected.</desc>
    <defs>
      <style>#sources-root { color: #2d3142; font-family: Geist, system-ui, sans-serif; }
      #sources-root .diagram-container { width: 100%; overflow-x: auto; }
      #sources-root .node { fill: #2d3142; font: 600 18px Geist, system-ui, sans-serif; }
      #sources-root .diagram-title { fill: #2d3142; font: 400 40px 'Instrument Serif', Georgia, serif; }
      #sources-root .sub { fill: #5a6580; font: 400 13px 'Geist Mono', monospace; }
      #sources-root .tag, #sources-root .eyebrow, #sources-root .row-label { fill: #4f5d75; font: 500 11px 'Geist Mono', monospace; letter-spacing: .10em; }
      #sources-root .stage { fill: #2d3142; font: 600 18px Geist, system-ui, sans-serif; }
      #sources-root .arrow-label { fill: #4f5d75; font: 400 11px 'Geist Mono', monospace; letter-spacing: .06em; }
      #sources-root .note { fill: #4f5d75; font: 400 15px Geist, system-ui, sans-serif; }
      #sources-root .diagram-footer { fill: #4f5d75; font: 400 12px 'Geist Mono', monospace; }
      @media print {
#sources-root .diagram-container { overflow-x: visible; }
}</style>
      <marker id="sources-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#4f5d75"/></marker>
      <marker id="sources-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#bf4520"/></marker>
      <marker id="sources-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#2e5aa8"/></marker>
    </defs>
    <rect width="1280" height="720" fill="#f5f5f5"/>
    <text x="80" y="104" class="eyebrow" font-size="11" text-anchor="start">01  FILE TO PASSAGES</text>
<text x="80" y="336" class="eyebrow" font-size="11" text-anchor="start">02  QUESTION TO RESULT</text>
<path d="M 280 220 H 340" fill="none" stroke="#4f5d75" stroke-width="2.2" marker-end="url(#sources-arrow)" />
<path d="M 540 220 H 600" fill="none" stroke="#bf4520" stroke-width="2.2" marker-end="url(#sources-arrow-accent)" />
<path d="M 280 448 H 340" fill="none" stroke="#4f5d75" stroke-width="2.2" marker-end="url(#sources-arrow)" />
<path d="M 680 276 V 336 Q 680 344 672 344 H 448 Q 440 344 440 352 V 408" fill="none" stroke="#4f5d75" stroke-width="2.2" marker-end="url(#sources-arrow)" />
