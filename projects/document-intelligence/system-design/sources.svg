<text x="990.0" y="220" class="arrow-label" font-size="11" text-anchor="middle">SOURCE ID</text>
<rect x="80" y="180" width="200" height="96" rx="6" fill="#f5f5f5" stroke="none" />
<rect x="80" y="180" width="200" height="96" rx="6" fill="#ffffff" stroke="#bfc0c0" />
<rect x="92" y="188" width="68" height="18" rx="2" fill="#f5f5f5" stroke="#bfc0c0" />
