<text x="96" y="234" class="node" font-size="18" text-anchor="start">Uploaded file</text>
<text x="96" y="258" class="sub" font-size="13" text-anchor="start">PDF / DOCX / TXT / MD</text>
<rect x="340" y="180" width="200" height="96" rx="6" fill="#f5f5f5" stroke="none" />
<rect x="340" y="180" width="200" height="96" rx="6" fill="#ffffff" stroke="#bfc0c0" />
<rect x="352" y="188" width="68" height="18" rx="2" fill="#f5f5f5" stroke="#bfc0c0" />
